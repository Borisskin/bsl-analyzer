name: CI

on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --all --no-fail-fast

  windows-mcp:
    name: Windows MCP stdio + secure broker
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build binary
        run: cargo build -p bsl-analyzer --bin bsl-analyzer-app
      - name: CLI MCP mode guard tests
        run: cargo test -p bsl-analyzer --bin bsl-analyzer-app mcp::tests
      - name: Broker runtime tests
        run: cargo test -p mcp-server --test broker
