[package]
name = "bsl-analyzer"
version.workspace = true
edition.workspace = true
license = "LGPL-3.0-or-later"
rust-version.workspace = true

[lib]
doctest = false

[[bin]]
name = "bsl-analyzer-app"
path = "src/bin/main.rs"

[features]
# Opt-in salsa DEBUG/TRACE runtime events (compile-time gated in salsa). Off by
# default so release artifacts never pay for it. Enable with
# `cargo build --features salsa-detailed-trace` and inspect via `BSL_LOG=salsa=debug`.
# Complements the always-available per-ingredient counters (`BSL_SALSA_EVENTS=1`).
salsa-detailed-trace = ["salsa/detailed-trace"]

[dependencies]
ide.workspace = true
ide-host-core.workspace = true
parser.workspace = true
ide-db.workspace = true
base-db.workspace = true
hir.workspace = true
lexer.workspace = true
syntax.workspace = true
salsa.workspace = true
bsl-metadata.workspace = true
bsl-platform.workspace = true
project-model.workspace = true
vfs.workspace = true
vfs-notify.workspace = true
paths.workspace = true
line-index.workspace = true
stdx.workspace = true
intern.workspace = true
profile.workspace = true
mcp-server.workspace = true
bsl-debug.workspace = true
onec-client.workspace = true
bsl-search.workspace = true

lsp-types.workspace = true
lsp-server.workspace = true

clap.workspace = true

tokio.workspace = true
tokio-util = "0.7"
crossbeam-channel.workspace = true

rayon.workspace = true
indicatif.workspace = true
parking_lot.workspace = true

serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
dirs = "6"
uuid = { version = "1", features = ["v4"] }
toml_edit = "0.25"

tracing.workspace = true
tracing-subscriber.workspace = true
tracing-tree.workspace = true
rustc-hash.workspace = true

anyhow.workspace = true
thiserror.workspace = true

walkdir.workspace = true
tempfile.workspace = true
blake3 = "1.8"
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
tikv-jemallocator.workspace = true
profile = { workspace = true, features = ["jemalloc"] }

[build-dependencies]
zip = { version = "8", default-features = false, features = ["deflate"] }
walkdir = "2.4"
winresource = "0.1"

[dev-dependencies]
expect-test.workspace = true
